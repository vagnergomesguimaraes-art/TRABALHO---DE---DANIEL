<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f4f6fb}
    .hero{background:linear-gradient(135deg,#4f46e5,#0ea5e9)}
    .tarefa{border-left:6px solid #ffc107}
    .tarefa.alta{border-left-color:#dc3545}
    .tarefa.baixa{border-left-color:#198754}
    .tarefa.feita .titulo{text-decoration:line-through;opacity:.5}
  </style>
</head>
<body>
  <header class="hero text-white text-center py-3">
    <h1 class="h4 mb-0">📚 StudyFlow</h1>
    <small>Organize suas tarefas da faculdade</small>
  </header>

  <main class="container my-4">
    <div class="row g-4">
      <section class="col-lg-4">
        <form id="form" class="card card-body shadow-sm" novalidate>
          <div class="mb-3">
            <label for="titulo" class="form-label">Tarefa</label>
            <input id="titulo" class="form-control" minlength="3" maxlength="60" required>
            <div class="invalid-feedback">Informe de 3 a 60 caracteres.</div>
          </div>
          <div class="mb-3">
            <label for="prazo" class="form-label">Prazo</label>
            <input type="date" id="prazo" class="form-control" required>
            <div class="invalid-feedback" id="prazoMsg">Informe uma data válida.</div>
          </div>
          <div class="mb-3">
            <label for="prioridade" class="form-label">Prioridade</label>
            <select id="prioridade" class="form-select">
              <option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option>
            </select>
          </div>
